name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  e2e:
    # Telas reais no Chromium, com o Supabase simulado em memória (sem banco nem rede).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes de tela
        run: npm run test:e2e
      - name: Guardar o relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          # postgis: usado na detecção de conflito espacial entre obras.
          sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - name: Migrations e testes do banco
        run: sudo -E bash scripts/test-db.sh
        env:
          PGBIN: /usr/lib/postgresql/16/bin
