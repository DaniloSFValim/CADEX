# Publicação do frontend no Cloudflare Workers (Static Assets).
#
#   npm run build && npx wrangler deploy
#
# O nome NÃO é "cadex": já existe na conta um Worker "cadex", de
# 30/07/2026, sem relação com este sistema — publicar com o mesmo nome
# o sobrescreveria.
name = "cadex-niteroi"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
# Toda rota desconhecida serve o index.html: a aplicação é uma SPA e a
# URL do QR Code (/verificar/<token>) precisa resolver (art. 14).
not_found_handling = "single-page-application"
